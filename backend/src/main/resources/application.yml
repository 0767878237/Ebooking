spring:
  application:
    name: ebooking-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ebooking}
    username: ${SPRING_DATASOURCE_USERNAME:ebooking}
    password: ${SPRING_DATASOURCE_PASSWORD:ebooking}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-}]"

ebooking:
  security:
    qr-secret: ${EBOOKING_QR_SECRET:local-development-qr-secret-change-me-32chars}
